spring.application.name=ai-support-ticket-management


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_support_ticket_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

management.endpoints.web.exposure.include=health,info
logging.level.com.aiticket=INFO

# Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.6-flash

# Gemini retry configuration
gemini.retry.max-attempts=3
gemini.retry.initial-delay-ms=1000

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
server.port=${PORT:10000}
